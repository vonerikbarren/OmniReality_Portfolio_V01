<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OmniOS</title>

  <script type="importmap">
  {
    "imports": {
      "three":          "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
      "three/addons/":  "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/",
      "gsap":           "https://cdn.jsdelivr.net/npm/gsap@3.12.5/index.js",
      "d3":             "https://cdn.jsdelivr.net/npm/d3@7.9.0/+esm",
      "d3-sankey":      "https://cdn.jsdelivr.net/npm/d3-sankey@0.12.3/+esm"
    }
  }
  </script>

  <!-- JSZip's own dist build is UMD, not an ES module, so it can't go
       in the importmap above like three/gsap — this sets a plain
       global window.JSZip instead, used by AdminPanel's export/import.
     V185: `defer` so this CDN fetch no longer blocks parsing of <body>
     (the boot animation starts as soon as the markup is parsed). Deferred
     scripts run before module scripts, so window.JSZip is still set before
     main.js evaluates. -->
  <script defer src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Courier New', Courier, monospace;
    }

    /* ── Canvas ───────────────────────────────────────────── */
    #omni-canvas {
      display: block;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    /* ── UI Shell (overlay — Phase 3) ────────────────────── */
    #omni-ui {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;   /* canvas stays interactive through it */
      /* Real fix — was 10. This creates its own stacking context
         (position:fixed + z-index together), which caps every real
         panel inside it (OmniChat included, regardless of its own,
         much higher internal z-index) at this one, outer number.
         ToolTipMenu's headers bypass this element entirely and
         append straight to document.body at z-index 40/41, so they
         were beating every real panel in here no matter what number
         that panel set internally. Raised just enough to clear
         ToolTipMenu (40/41) and OmniAimReticle (50) — the two direct-
         body-children actually sitting below where interactive
         panels belong — while staying under the real, intentional
         modal-style overlays (OmniDrawModePicker at 65, GridPanel at
         80) that are correctly meant to sit above everything. */
      z-index: 55;
    }

    /* ── Boot screen ─────────────────────────────────────── */
    #omni-boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
      z-index: 100;
      transition: opacity 1.2s ease;
    }

    #omni-boot.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    /* V187 — Omni⟐Star lockup: the wordmark is "Omni" + ⟐ + "Star" (real text, one
       font). The animated star is NOT part of the line any more: it sits centred
       BEHIND the ⟐ (absolute, z-index -1 inside the h1's stacking context, so all
       text paints over it) and arrives as a shooting star from the top right.
       Sizes are in em so everything scales with the clamp() below (390px phones). */
    #omni-boot > * { position: relative; z-index: 1; }
    #omni-boot > #boot-starfield {
      position: absolute; inset: 0; z-index: 0; pointer-events: none;
    }
    .boot-brand {
      --boot-star: 1.15em;               /* star box. V190: was 3.1em (landed mark ~4x the glyph height); now the landed mark is ~1.3-1.4x the glyph height. boot/OmniStarBoot.js CONFIG.STAR_EM sets this at run time. */
      font-size: clamp(2rem, 6vw, 4rem);
      font-weight: normal;
      color: #fff;
      text-align: center;
      max-width: 100vw;
    }
    .boot-row {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .boot-glyph {
      letter-spacing: 0.15em;
      margin-right: -0.15em;             /* trailing letter-spacing would shift the visible text left */
      text-shadow: 0 0 2px rgba(0, 0, 0, 0.9), 0 0 5px rgba(0, 0, 0, 0.55), 0 0 14px rgba(255, 255, 255, 0.28);   /* dark rim keeps the letters readable when the (white) star passes behind them */
      white-space: nowrap;
    }
    .boot-glyph .bw { opacity: 0.96; animation: bootWordIn 0.6s ease both; }
    .boot-glyph .bw-g { animation-delay: 0.7s; animation-duration: 0.7s; }   /* the glyph appears as the star approaches */
    @keyframes bootWordIn { from { opacity: 0; } to { opacity: 0.96; } }
    .boot-mark {                         /* the ⟐ plus the star/comet that sit behind it */
      position: relative;
      display: inline-block;
    }
    .bw-g {                              /* stays white in front of the star; the dark halo keeps it readable on the glow */
      text-shadow: 0 0 2px #000, 0 0 5px rgba(0, 0, 0, 0.85), 0 0 12px rgba(0, 0, 0, 0.6);
    }
    .boot-star, .boot-comet {
      position: absolute;
      left: 50%; top: 50%;
      z-index: -1;
      pointer-events: none;
    }
    .boot-star {
      display: block;
      width: var(--boot-star);
      height: var(--boot-star);
      margin: calc(var(--boot-star) / -2 + var(--my, 0px)) 0 0 calc(var(--boot-star) / -2 + var(--mx, 0px));
      letter-spacing: 0;
      opacity: 0;
      will-change: transform;
    }
    .boot-star::before {                 /* soft round halo, does not rotate */
      content: '';
      position: absolute;
      inset: -30%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(var(--boot-star-rgb, 255,255,255),0.22) 0%, rgba(var(--boot-star-rgb, 255,255,255),0.07) 38%, rgba(var(--boot-star-rgb, 255,255,255),0) 68%);
      pointer-events: none;
    }
    .boot-star svg {
      position: relative;
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
      opacity: var(--boot-star-alpha, 0.7);   /* whole-group opacity: core + spikes overlap without double-blending */
      filter: drop-shadow(0 0 calc(var(--boot-star) * 0.025) rgba(var(--boot-star-rgb, 255,255,255), 0.85));   /* V190: glow scales with the (smaller) star */
    }
    .boot-star path, .boot-star circle { fill: var(--boot-star-color, #fff); }   /* V190: --boot-star-color from the dev intro settings */
    .boot-comet {                        /* JS-made: tapered gradient tail, head at the star centre, rotated/scaled by animations */
      height: calc(var(--boot-star) * 0.42);
      opacity: 0;
      transform-origin: 100% 50%;
      background: linear-gradient(to right, rgba(var(--boot-star-rgb, 255,255,255),0) 0%, rgba(var(--boot-comet-mid, 190,215,255),0.55) 50%, rgba(var(--boot-star-rgb, 255,255,255),0.95) 100%);
      clip-path: polygon(0 50%, 100% 0, 100% 100%);
      will-change: transform, opacity;
    }
    .boot-sub {
      display: block;
      margin-top: 0.22em;
      padding-left: 0.6em;               /* balances trailing letter-spacing */
      font-size: max(0.3em, 11px);
      letter-spacing: 0.6em;
      text-transform: none;
      text-shadow: 0 0 2px rgba(0, 0, 0, 0.9), 0 0 5px rgba(0, 0, 0, 0.6);
      opacity: 0;
      animation: bootSubIn 0.9s ease 0.9s forwards;
    }
    @keyframes bootSubIn { from { opacity: 0; } to { opacity: 0.65; } }
    @media (prefers-reduced-motion: reduce) {
      .boot-glyph .bw { animation: none; opacity: 0.96; }
      .boot-sub { animation: none; opacity: 0.65; }
      .boot-enter-btn { transition: none; }
    }

    .boot-progress-track {
      margin: 28px auto 0;
      width: min(260px, 60vw);
      height: 3px;
      background: rgba(255, 255, 255, 0.14);
      border-radius: 2px;
      overflow: hidden;
    }

    .boot-progress-bar {
      height: 100%;
      width: 0%;
      background: #ffffff;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.9), 0 0 2px rgba(255, 255, 255, 1);
      border-radius: 2px;
      transition: width 14s cubic-bezier(0.11, 0.65, 0.2, 1);
    }

    .boot-progress-bar.is-complete {
      transition: width 0.25s ease;
    }

    .boot-enter-btn {
      margin-top: 36px;
      padding: 12px 32px;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 999px;
      color: #fff;
      font-family: inherit;
      font-size: 0.9rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease, background 0.2s ease, border-color 0.2s ease;
    }

    .boot-enter-btn.is-ready {
      opacity: 1;
      pointer-events: auto;
    }

    .boot-enter-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.9);
    }
  </style>
</head>
<body>

  <!-- Boot screen — fades once scene is ready -->
  <div id="omni-boot">
    <h1 class="boot-brand" aria-label="Omni Star OmniOS">
      <span class="boot-row">
        <span class="boot-glyph" id="boot-wordmark" aria-hidden="true"><span class="bw">Omni</span><span class="boot-mark" id="boot-mark"><span class="bw bw-g" id="boot-glyph-char">&#x27D0;</span><span class="boot-star" id="boot-star"><svg viewBox="-60 -60 120 120" focusable="false"><path id="boot-star-path" d=""/></svg></span></span><span class="bw">Star</span></span>
      </span>
      <span class="boot-sub" aria-hidden="true">OmniOS</span>
    </h1>
    <div class="boot-progress-track">
      <div class="boot-progress-bar" id="boot-progress-bar"></div>
    </div>
    <button class="boot-enter-btn" id="boot-enter-btn">Enter</button>
  </div>

  <!-- V185 OmniStar boot animation (V187: shooting-star entrance behind the ⟐) — classic script, no dependency on main.js. -->
  <script src="./boot/OmniStarBoot.js"></script>

  <!-- Plain (non-module) script — runs immediately as the HTML parses,
       before the browser even needs to resolve main.js's full ES module
       import graph (~40 files, no bundler). Starts the bar trickling
       toward 90% right away so the bar actually spans the real load
       time, however long it turns out to be; main.js's dismissBoot()
       snaps it to 100% the moment the app is genuinely ready. -->
  <script>
    requestAnimationFrame(() => {
      const bar = document.getElementById('boot-progress-bar')
      if (bar) bar.style.width = '90%'
    })
  </script>

  <!-- WebGL canvas -->
  <canvas id="omni-canvas"></canvas>

  <!-- UI overlay shell — populated in Phase 3 -->
  <div id="omni-ui"></div>

  <!-- Entry point -->
  <script type="module" src="./main.js"></script>

</body>
</html>
